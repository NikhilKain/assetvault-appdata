name: Build catalogue

on:
  schedule:
    # 03:10 UTC daily. Off the hour on purpose — the top of the hour is when every
    # other scheduled workflow on GitHub fires, and the queue wait shows.
    - cron: "10 3 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Space-separated source names to build (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-catalogue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Build catalogue
        env:
          # Optional. Without it the Google Fonts source skips itself and the build
          # still succeeds — every other source is keyless by design.
          GOOGLE_FONTS_KEY: ${{ secrets.GOOGLE_FONTS_KEY }}
        run: python -m scripts.build_catalog ${{ inputs.sources }}

      - name: Summarise
        run: |
          python - <<'PY'
          import json, pathlib
          meta = json.loads(pathlib.Path("data/meta.json").read_text(encoding="utf-8"))
          size = sum(p.stat().st_size for p in pathlib.Path("data").rglob("*.json"))
          lines = [
              f"**{meta['total']} assets** · built {meta['builtAt']} · {size / 1024 / 1024:.1f} MB total",
              "",
              "| Source | Assets |",
              "| --- | ---: |",
              *(f"| {k} | {v} |" for k, v in sorted(meta["providers"].items(), key=lambda kv: -kv[1])),
          ]
          pathlib.Path("summary.md").write_text("\n".join(lines), encoding="utf-8")
          PY
          cat summary.md >> $GITHUB_STEP_SUMMARY

      - name: Publish to gh-pages
        run: |
          # The deploy tree is built from scratch and force-pushed, so gh-pages only
          # ever holds what this run produced — no stale files accumulate, and the
          # branch carries no history to grow.
          mkdir _deploy
          cp -r data _deploy/data
          cp README.md _deploy/README.md
          # Jekyll would otherwise try to process the tree and hide anything it does
          # not understand.
          touch _deploy/.nojekyll

          cd _deploy
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "catalogue $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force --quiet \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages
